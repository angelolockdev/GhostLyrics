name: Release Windows

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Nom du tag de version (ex: v0.1.0)'
        required: false
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Windows Release
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: pnpm install

      - name: Build Tauri App & Publish GitHub Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag_name }}
          releaseName: 'GhostLyrics ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag_name }}'
          releaseBody: |
            ## 👻 GhostLyrics Release ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag_name }}

            Alternative open source et ultra-légère à Lyric Overlay pour Windows.

            ### ✨ Nouveautés & Fonctionnalités
            - **Détection universelle :** Suivi automatique de la lecture via Windows WinRT GSMTC (Spotify, Apple Music, YouTube Music, VLC, etc.)
            - **Paroles synchronisées :** Intégration en direct avec l'API publique LRCLIB
            - **Mode Fantôme (*Click-Through*) :** Raccourci global pour cliquer librement au travers en jeu
            - **Personnalisation :** Panneau de configuration pour les styles, l'opacité et le décalage temporel

            ### 📦 Téléchargement
            Téléchargez l'installateur Windows ci-dessous (`.exe` NSIS ou `.msi`).
          releaseDraft: false
          prerelease: false
