[package]
name = "ghost-lyrics"
version = "0.2.4"
description = "Open-source floating synced lyrics overlay for Windows"
authors = ["Angelo LOCK TO HANG"]
edition = "2021"

[lib]
name = "ghost_lyrics_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
regex = "1.10"
urlencoding = "2.1"

[target.'cfg(windows)'.dependencies.windows]
version = "0.58"
features = [
    "Media",
    "Media_Control",
    "Foundation",
    "Foundation_Collections",
    "Storage_Streams",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Foundation",
]
